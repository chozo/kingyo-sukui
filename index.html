<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>金魚すくい</title>
<meta name="description" content="金魚以外がすくえることも・・・ すくい上げるまで正体がわからない、3枚のポイで挑む金魚すくい。" />
<meta name="theme-color" content="#06101c" />
<link rel="canonical" href="https://game.chozo.net/kingyo-sukui/" />
<meta property="og:type" content="website" />
<meta property="og:locale" content="ja_JP" />
<meta property="og:title" content="金魚すくい" />
<meta property="og:description" content="金魚以外がすくえることも・・・ すくい上げるまで正体がわからない、3枚のポイで挑む金魚すくい。" />
<meta property="og:url" content="https://game.chozo.net/kingyo-sukui/" />
<meta property="og:image" content="https://game.chozo.net/kingyo-sukui/ogp.png" />
<meta property="og:image:type" content="image/png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="金魚すくい — 金魚以外がすくえることも・・・ 魚影の泳ぐ水槽と、すくい上げた金魚の正体画面" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="金魚すくい" />
<meta name="twitter:description" content="金魚以外がすくえることも・・・ すくい上げるまで正体がわからない、3枚のポイで挑む金魚すくい。" />
<meta name="twitter:image" content="https://game.chozo.net/kingyo-sukui/ogp.png" />
<meta name="twitter:image:alt" content="金魚すくい — 金魚以外がすくえることも・・・" />
<link rel="icon" href="./favicon.svg" />
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="box"><small>のこり</small><b id="time">60</b></div>
    <div class="box mid"><div id="pois"></div><div id="strength"><div id="strength-bar"></div></div></div>
    <div class="box"><small>とくてん</small><b id="score">0</b></div>
  </div>
  <div id="toasts"></div>
  <div id="hint"></div>
  <div id="flash"></div>
  <section id="reveal" hidden>
    <div class="rv-card">
      <p id="rv-label"></p>
      <h2 id="rv-name"></h2>
      <p id="rv-sub"></p>
      <p id="rv-kg"></p>
      <p id="rv-desc"></p>
      <p id="rv-pts"></p>
      <p class="rv-foot"><span id="rv-count"></span><span>タップでつづける</span></p>
    </div>
  </section>
  <section id="title" class="overlay">
    <h1>金魚すくい<span class="sub">金魚以外がすくえることも・・・</span></h1>
    <p>3枚のポイで、より多くの金魚と魚を<br />すくい上げよう！</p>
    <button id="start">はじめる</button>
  </section>
  <section id="result" class="overlay" hidden>
    <h2>けっか</h2>
    <div class="score"><b id="result-score">0</b>点</div>
    <p id="result-best"></p>
    <ul id="result-list"></ul>
    <button id="retry">もう一度</button>
    <button id="home" class="sub">タイトルへ</button>
  </section>
  <button id="sound" type="button" aria-label="音を消す"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="mute" d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
</div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
